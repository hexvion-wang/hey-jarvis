<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Jarvis" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#000810" />
    <title>J.A.R.V.I.S.</title>
  </head>
  <body>
    <video id="cam" playsinline muted autoplay></video>
    <div id="tint"></div>
    <canvas id="hud"></canvas>

    <div id="status">
      <span id="clock">--:--:--</span>
      <span id="fps">FPS --</span>
      <span id="hands">HANDS 0</span>
      <span id="state">STANDBY</span>
    </div>
    <div id="gestureBar">
      <span id="gesture">NO HAND</span>
      <span id="clicks">CLICK 0</span>
    </div>

    <div id="start">
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <button id="startBtn">啟動 J.A.R.V.I.S.</button>
      <p class="hint">需要允許使用鏡頭</p>
      <p id="error"></p>
    </div>

    <script type="module" src="./src/phone/main.ts"></script>
  </body>
</html>

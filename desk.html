<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000810" />
    <title>J.A.R.V.I.S. · Desk</title>
  </head>
  <body class="desk">
    <div id="tint"></div>
    <canvas id="hud"></canvas>

    <div id="status">
      <span id="clock">--:--:--</span>
      <span id="mic">MIC OFF</span>
      <span id="voice">VOICE --</span>
      <span id="state">STANDBY</span>
    </div>

    <div id="caption">
      <p id="headline">待命中</p>
      <p id="sub">說「嘿，海克斯」或「Hey Hex」叫醒我　·　空白鍵模擬喚醒</p>
      <p id="transcript"></p>
    </div>

    <div id="panel">
      <div class="row">
        <button id="trainBtn">訓練喚醒詞</button>
        <button id="clearBtn">清除</button>
      </div>
      <div class="row">
        <button id="standbyBtn">回到待命（Esc）</button>
      </div>
      <div class="row link-row">
        <input id="linkCode" inputmode="numeric" maxlength="4" placeholder="iPhone 配對碼" />
        <button id="linkBtn">連線</button>
      </div>
      <p class="label">iPhone：<span id="linkState">未連線</span></p>
      <input id="typeCmd" placeholder="打字下指令，例如：打開今天的日報（Enter 送出）" />
      <p class="label">已學會：<span id="learned"></span></p>
      <p class="label">最近聽到（✓ = 有叫醒）</p>
      <ul id="history"></ul>
    </div>

    <div id="start">
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <button id="startBtn">啟動 J.A.R.V.I.S.</button>
      <p class="hint">需要允許使用麥克風 · 版本 <span id="ver"></span></p>
      <p id="error"></p>
    </div>

    <script type="module" src="./src/desk/main.ts"></script>
  </body>
</html>
